# Tooling config. CI (.github/workflows/checks.yml) and .claude/check.sh run these tools; versions are pinned in the
# dependency group below and in uv.lock. Not a Python package: nothing here is built or installed for users.
[dependency-groups]
dev = ["ruff==0.17.5", "ty==0.0.104"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Ruff formats Markdown code blocks by default; this repo's Markdown is not its to touch.
include = ["*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter or with another rule: off by design, not by violations.
    "COM812",  # missing-trailing-comma: ruff format decides the trailing commas
    "ISC001",  # single-line-implicit-string-concatenation: ruff format may join the lines
    "D203",    # incorrect-blank-line-before-class: D211 says the opposite
    "D213",    # multi-line-summary-second-line: D212 says the opposite
    # Rules the code fails today, with the number of violations on 2026-11-16 (ruff 0.17.5). Fix a rule's violations,
    # delete its line, and CI keeps it passing from then on.
    "PLR2004", # 382 magic-value-comparison
    "D103",    # 257 undocumented-public-function
    "N806",    # 155 non-lowercase-variable-in-function
    "T201",    # 123 print
    "RUF100",  # 121 unused-noqa
    "ANN001",  # 119 missing-type-function-argument
    "D205",    # 82 missing-blank-line-after-summary
    "CPY001",  # 77 missing-copyright-notice
