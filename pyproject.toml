[tool.ty.environment]
python-version = "3.12"

# ty runs without the third-party packages (numpy, opencv, ... are not installed in CI), so their imports do not resolve.
# The template folders import their own modules by sys.path.insert, which ty cannot see; .claude/check.sh gives each
# template its own search path. Rules the code fails today, with the number of violations on 2026-11-16 (ty 0.0.104).
[tool.ty.rules]
invalid-argument-type = "ignore"  # 296
import-not-found = "ignore"  # 201
unsupported-operator = "ignore"  # 81
not-subscriptable = "ignore"  # 58
not-iterable = "ignore"  # 54
invalid-assignment = "ignore"  # 32
missing-union-attribute = "ignore"  # 17
invalid-explicit-return = "ignore"  # 6
index-out-of-bounds = "ignore"  # 4
possibly-missing-submodule = "ignore"  # 1
no-matching-overload = "ignore"  # 1
missing-attribute = "ignore"  # 1
lost-keyword-for-regular-parameter = "ignore"  # 1
