<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio edit</title>
<link rel="icon" href="data:,">
<!-- DialKit 2.0.2 (Josh Puckett, MIT), tal cual viene: copiado en recipe/vendor/, el editor no sale a la red -->
<link rel="stylesheet" href="recipe/vendor/dialkit-2.0.2/styles.css">
<style>
  :root {
    --bg: #0f0f10; --panel: #18181a; --raised: #232326; --line: rgba(255,255,255,0.08);
    --text: #f2f2f3; --dim: #8e8e93; --accent: #0a84ff;
    --section: rgba(255,255,255,0.7);  /* titulos de seccion: el --dial-text-section de DialKit */
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden; user-select: none;
  }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; background: var(--panel); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; height: 34px; padding: 0 12px;
    border-radius: 7px; font-size: 13px; color: var(--dim);
    transition: background 160ms var(--ease), color 160ms var(--ease);
  }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .seg button:active { color: var(--text); }
  .seg button:disabled { opacity: 0.35; cursor: default; }
  .seg button:focus-visible, .item:focus-visible, .primary:focus-visible, .close:focus-visible, .knob:focus-visible, .zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .photos button { gap: 8px; padding: 0 10px 0 3px; }
  .photos img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; }
  .photos button[data-flipped] img { scale: -1 1; }  /* con Flip, la miniatura de esa foto tambien espejada */
  /* con muchas fotos la barra se desplaza en vez de empujar Export */
  .photos { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .photos button { flex: none; }
  /* sumar fotos: el + aparte, al lado de Export (pedido del fotografo, 2026-10-19), y las que se estan preparando como pestanas sin
     miniatura al final de la barra */
  .actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .add {
    all: unset; cursor: pointer; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9px;
    background: var(--panel); color: var(--dim); transition: background 160ms var(--ease), color 160ms var(--ease);
  }
  .add svg { width: 13px; height: 13px; }
  .add:active { background: var(--raised); color: var(--text); }
  .add:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (hover: hover) and (pointer: fine) { .add:hover { color: var(--text); } }
  @media (prefers-reduced-motion: no-preference) {
    .add { transition: background 160ms var(--ease), color 160ms var(--ease), scale 120ms var(--ease); }
    .add:active { scale: 0.96; }
  }
  .photos .pending {
    padding: 0 12px; gap: 8px; cursor: default;
    transition: opacity 200ms var(--ease), background 160ms var(--ease), color 160ms var(--ease);
  }
  @starting-style { .photos .pending { opacity: 0; } }  /* la pestana nueva aparece, no salta */
  .photos .pending .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); transition: background 160ms var(--ease); }
  .photos .pending.ready { cursor: pointer; color: var(--text); }
  .photos .pending.ready .dot { background: var(--accent); }
  .photos .pending.failed { cursor: pointer; }
  .photos .pending.failed .dot { background: #ff453a; }
  @media (prefers-reduced-motion: no-preference) {
    .photos .pending:not(.ready, .failed) .dot { animation: working 1.2s ease-in-out infinite; }
  }
  @keyframes working { 50% { opacity: 0.3; } }
  /* soltar archivos sobre la ventana */
  .drop {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; pointer-events: none;
    background: rgba(15,15,16,0.72); opacity: 0; transition: opacity 120ms var(--ease);
  }
  .drop p { padding: 14px 20px; border: 1.5px dashed rgba(255,255,255,0.35); border-radius: 12px; font-size: 14px; }
  .drop.show { opacity: 1; }
  .spacer { flex: 1; }
  .primary {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; height: 40px; padding: 0 16px;
    border-radius: 9px; font-size: 13px; font-weight: 500;
    background: var(--accent); color: white; transition: filter 160ms var(--ease);
  }
  .primary:active { filter: brightness(0.92); }
  .primary:disabled { opacity: 0.4; cursor: default; filter: none; }
  /* exportar: un modal en el centro, la vista previa grande a la izquierda y las opciones a la derecha */
  .export {
    --pv: min(560px, calc(100vh - 120px), calc(100vw - 400px));
    margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 16px; max-width: none; max-height: none;
    background: var(--panel); color: var(--text); box-shadow: 0 30px 90px rgba(0,0,0,0.6);
    opacity: 0; transition: opacity 120ms var(--ease), overlay 120ms allow-discrete, display 120ms allow-discrete;
  }
  .export[open] { opacity: 1; transition-duration: 200ms; }
  @starting-style { .export[open] { opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .export { translate: 0 8px; transition: opacity 120ms var(--ease), translate 200ms var(--ease), overlay 120ms allow-discrete, display 120ms allow-discrete; }
    .export[open] { translate: 0 0; }
    @starting-style { .export[open] { translate: 0 8px; } }
  }
  .export::backdrop {
    background: rgba(0,0,0,0.55); opacity: 0;
    transition: opacity 120ms var(--ease), overlay 120ms allow-discrete, display 120ms allow-discrete;
  }
  .export[open]::backdrop { opacity: 1; transition-duration: 200ms; }
  @starting-style { .export[open]::backdrop { opacity: 0; } }
  .sheet { display: grid; grid-template-columns: var(--pv) 268px; gap: 20px; padding: 16px 20px 16px 16px; }
  .side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .side .title { display: flex; align-items: center; justify-content: space-between; height: 28px; }
  .side h2 { font-size: 15px; font-weight: 600; }
  .close {
    all: unset; cursor: pointer; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px;
    color: var(--dim); transition: background 160ms var(--ease), color 160ms var(--ease);
  }
  .close:active { color: var(--text); background: var(--raised); }
  .field { display: grid; gap: 8px; }
  .field > span { font-size: 12px; color: var(--dim); }
  .side .seg { display: flex; background: var(--bg); }
  .side .seg button { flex: 1; justify-content: center; height: 30px; padding: 0 4px; font-size: 12px; }
  .side .foot { margin-top: auto; display: grid; gap: 12px; }
  /* lo que se baja: que es (la version, o el RAW) y el archivo: tamano, bits, formato y peso */
  .summary { display: grid; gap: 3px; min-width: 0; }
  .summary p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #what { font-size: 13px; font-weight: 500; }
  #info { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* un servidor viejo o apagado no puede armar el archivo: el aviso se ve y Download se apaga */
  .foot[data-state="warn"] #info, #info.heavy { color: #ffb340; white-space: normal; }
  .foot[data-state="warn"] .primary { opacity: 0.4; cursor: default; filter: none; }
  .side .primary { justify-content: center; height: 38px; }
  /* la vista previa es el archivo: entra entero en el cuadro, con su proporcion */
  .preview {
    position: relative; width: var(--pv); height: var(--pv); border-radius: 10px; overflow: clip;
    display: grid; place-items: center; background: var(--bg);
  }
  .preview canvas { display: block; max-width: 100%; max-height: 100%; }
  /* el marco del recorte: se mueve arrastrando adentro y se agranda o achica arrastrando bordes y esquinas (el cursor lo
     pone el script segun donde esta el puntero); con foco, las flechas lo corren */
  .preview canvas { touch-action: none; }
  .preview canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { display: grid; grid-template-columns: 220px 1fr 300px; min-height: 0; }
  /* izquierda: la vista y las versiones de la foto */
  /* las dos barras van en pareja (pedido del fotografo, 2026-10-19): el mismo margen de 12 a los costados y 8 arriba, titulos de 36 al
     ras del margen, filas de 36 con el texto a 22 del borde, y entre secciones la misma linea que DialKit pone entre
     carpetas, a 10 de la ultima fila y pegada al titulo siguiente. Los numeros salen de DialKit (--dial-row-height 36,
     --dial-radius 8, el padding-bottom de .dialkit-folder-inner) */
  .side-nav { padding: 8px 12px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; }
  /* los titulos, como los de las carpetas de DialKit: 13, semibold, en oracion, al ras del margen */
  .side-nav h2 { display: flex; align-items: center; height: 36px; font-size: 13px; font-weight: 600; color: var(--section); letter-spacing: -0.01em; }
  .side-nav h2 ~ h2 { height: 37px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.06); }
  .list { display: flex; flex-direction: column; gap: 2px; }
  .item {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px;
    font-size: 13px; color: var(--dim); transition: background 160ms var(--ease), color 160ms var(--ease);
  }
  .item[aria-current="true"], .item[aria-pressed="true"] { color: var(--text); background: var(--raised); }
  .item:active { color: var(--text); background: rgba(255,255,255,0.07); }
  .item svg { width: 14px; height: 14px; flex: none; }
  .version { position: relative; display: grid; }
  /* el nombre en una linea; el lugar del ⋯ y la X se reserva solo mientras se ven, y ahi el nombre se recorta */
  .version .item > span { min-width: 0; overflow: clip; text-overflow: ellipsis; white-space: nowrap; }
  .version:focus-within .item, .version:has(.act[aria-expanded="true"]) .item { padding-right: 62px; }
  /* renombrar: el nombre pasa a ser un campo en el mismo lugar, con la misma medida */
  .rename {
    all: unset; box-sizing: border-box; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 13px;
    color: var(--text); background: var(--raised); outline: 2px solid var(--accent); outline-offset: -2px; cursor: text; user-select: text;
  }
  .version-menu { min-width: 180px; }
  /* los dos menus (Before y el de cada version) salen de su boton: aparecen en 150 ms y se van en 100, mas rapido que
     al entrar. Crecen desde arriba a la izquierda, que es donde esta lo que los abrio */
  .before-menu, .version-menu {
    transform-origin: top left; opacity: 0;
    transition: opacity 100ms var(--ease), scale 100ms var(--ease), overlay 100ms allow-discrete, display 100ms allow-discrete;
  }
  .before-menu:popover-open, .version-menu:popover-open { opacity: 1; transition-duration: 150ms; }
  @starting-style { .before-menu:popover-open, .version-menu:popover-open { opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    .before-menu, .version-menu { scale: 0.97; }
    .before-menu:popover-open, .version-menu:popover-open { scale: 1; }
    @starting-style { .before-menu:popover-open, .version-menu:popover-open { scale: 0.97; } }
  }
  /* borrar una version: aparece al pasar el puntero o con el foco en la fila */
  .act {
    all: unset; cursor: pointer; position: absolute; right: 5px; top: 50%; translate: 0 -50%;
    display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--dim);
    opacity: 0; transition: opacity 120ms var(--ease), background 120ms var(--ease), color 120ms var(--ease);
  }
  .act svg { width: 10px; height: 10px; }
  .act.more { right: 31px; }
  .act.more svg { width: 12px; height: 12px; }
  .act[aria-expanded="true"] { opacity: 1; color: var(--text); background: rgba(255,255,255,0.08); }
  .version:focus-within .act { opacity: 1; }
  .act:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .act:active { color: var(--text); background: rgba(255,255,255,0.1); }
  /* los atajos, abajo: la tecla y lo que hace */
  .keys { margin-top: auto; padding-top: 14px; display: grid; gap: 8px; font-size: 12px; color: var(--dim); }
  .keys p { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .keys p[hidden] { display: none; }
  kbd {
    font: inherit; font-size: 11px; color: var(--text); padding: 2px 6px; border-radius: 5px;
    background: var(--raised); border: 1px solid var(--line);
  }
  .stage { position: relative; display: grid; place-items: center; min-height: 0; overflow: clip; }
  .frame {
    position: relative; border-radius: 4px; touch-action: none; cursor: grab;
    background: #000; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--line);
  }
  .frame.dragging { cursor: grabbing; }
  /* en el antes y despues con la foto entera no hay nada que mover: arrastrar en cualquier parte corre la barra */
  .frame.compare.fitted, .frame.splitting { cursor: ew-resize; }
  /* la foto: un lienzo de WebGL; arranca invisible y aparece una sola vez, cuando llega la primera imagen */
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: inherit; opacity: 0; transition: opacity 200ms var(--ease); }
  .frame.ready #canvas { opacity: 1; }
  /* la barra del antes y despues. .split es la zona de agarre: 44 px de ancho a lo alto de toda la foto, con la linea
     (::before) en el medio y la manija. La foto no recorta (el radio va en el lienzo): en los bordes la manija queda
     entera, colgando en el margen, y se sigue pudiendo agarrar */
  .split {
    --hit: 44px;
    position: absolute; top: 0; bottom: 0; left: 50%; width: var(--hit); margin-left: calc(var(--hit) / -2);
    cursor: ew-resize; opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease);
  }
  .split::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px;
    background: rgba(255,255,255,0.9); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.3);
  }
  .frame.compare .split { opacity: 1; pointer-events: auto; }
  /* la manija: una capsula vertical, como la linea que la atraviesa */
  .knob {
    position: absolute; top: 50%; left: 50%; width: 28px; height: 44px; translate: -50% -50%; border-radius: 14px;
    display: grid; place-items: center; background: #fff; color: #1c1c1e;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.3);
  }
  .knob svg { opacity: 0.7; }
  .frame.splitting .knob { scale: 1.06; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.15), 0 4px 14px rgba(0,0,0,0.35); }
  .label {
    position: absolute; top: 12px; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 500;
    background: rgba(0,0,0,0.55); color: var(--text); pointer-events: none; opacity: 0; transition: opacity 180ms var(--ease);
  }
  .label.before { left: 12px; }
  .label.after-label { right: 12px; }
  .frame.compare .label { opacity: 1; }
  /* el antes es un menu nuestro, con la forma de los de DialKit: el RAW o cualquier otra version de la foto */
  .pick {
    border: 0; font-family: inherit; line-height: inherit; display: inline-flex; align-items: center; gap: 5px;
    padding-right: 7px; cursor: pointer; transition: opacity 180ms var(--ease), background-color 160ms var(--ease);
  }
  .pick::after { content: ""; position: absolute; inset: min(0px, (100% - 44px) / 2); }  /* 44 px de alto para el clic */
  .pick svg { opacity: 0.7; }
  .frame.compare .pick { pointer-events: auto; }
  .pick:active, .pick[aria-expanded="true"] { background-color: rgba(0,0,0,0.8); }
  .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* sin otra version que elegir, el antes es el RAW y nada mas: un rotulo, sin flecha */
  .pick:disabled { cursor: default; padding-right: 9px; }
  .pick:disabled svg { display: none; }
  .frame.compare .pick:disabled { pointer-events: none; }
  /* un rotulo que la barra tapa se va (quedaria sobre el otro lado de la foto), y con Espacio se van los dos */
  .frame.compare .label.covered { opacity: 0; pointer-events: none; }
  .before-menu { min-width: 168px; }
  /* tercios mientras se mueve; en difference se ven sobre la pared clara y sobre la ropa negra */
  .grid {
    --grid-line: rgba(255,255,255,0.6);
    --a: calc(100% / 3); --b: calc(200% / 3);
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: difference;
    background:
      linear-gradient(to right, transparent calc(var(--a) - 0.5px), var(--grid-line) 0 calc(var(--a) + 0.5px),
                      transparent 0 calc(var(--b) - 0.5px), var(--grid-line) 0 calc(var(--b) + 0.5px), transparent 0),
      linear-gradient(to bottom, transparent calc(var(--a) - 0.5px), var(--grid-line) 0 calc(var(--a) + 0.5px),
                      transparent 0 calc(var(--b) - 0.5px), var(--grid-line) 0 calc(var(--b) + 0.5px), transparent 0);
    opacity: 0; transition: opacity 240ms var(--ease);
  }
  .frame.moving .grid { opacity: 1; transition-duration: 120ms; }
  /* la guia de la foto de perfil (2026-10-23): el circulo o el cuadrado mas grande que entra en lo que se ve, centrado, y
     afuera oscurecido. La sombra se recorta en .mask (el marco no recorta: la manija del antes y despues cuelga en el
     margen). Apagada por defecto */
  .mask { position: absolute; inset: 0; pointer-events: none; overflow: clip; border-radius: inherit; container-type: size; opacity: 0; transition: opacity 200ms var(--ease); }
  .mask::after {
    content: ""; position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: min(100cqw, 100cqh); aspect-ratio: 1;
    box-shadow: 0 0 0 9999px rgba(15,15,16,0.62), inset 0 0 0 1px rgba(255,255,255,0.35);
  }
  .frame[data-guide] .mask { opacity: 1; }
  .frame[data-guide="circle"] .mask::after { border-radius: 50%; }
  .loading {
    position: absolute; top: 14px; left: 50%; translate: -50% 0; padding: 5px 10px; border-radius: 20px;
    font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--line);
    pointer-events: none; opacity: 0; transition: opacity 160ms var(--ease);
  }
  /* el zoom: Fit, o el porcentaje (100 % = un pixel de la foto por pixel de la pantalla). Es un boton que va de Fit al
     100 % y vuelve, como el doble clic */
  .zoom {
    all: unset; cursor: pointer; position: absolute; bottom: 14px; left: 50%; translate: -50% 0;
    min-width: 34px; padding: 5px 10px; border-radius: 20px; text-align: center;
    font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--line);
    font-variant-numeric: tabular-nums; transition: color 160ms var(--ease), background 160ms var(--ease);
  }
  .zoom:active { color: var(--text); background: var(--raised); }
  .loading.show { opacity: 1; transition-delay: 300ms; }
  /* derecha: el panel de DialKit en linea es la barra misma, como el de la izquierda: sin una tarjeta adentro, sobre el
     fondo de la pagina. DialKit pinta con --dial-glass-bg su fondo y lo que tapa al desplazar debajo de sus titulos */
  aside { border-left: 1px solid var(--line); min-height: 0; overflow-y: auto; transition: opacity 160ms var(--ease); }
  aside .dialkit-root { --dial-glass-bg: var(--bg); }
  aside .dialkit-panel-inner { backdrop-filter: none; -webkit-backdrop-filter: none; }
  aside .dialkit-panel[data-mode="inline"] .dialkit-panel-wrapper { padding-top: 8px; }
  /* sin el titulo "Edit": la barra izquierda no tiene uno, y asi las dos abren con un titulo de seccion a la misma altura.
     El panel se llama por el aria-label del aside */
  aside .dialkit-panel-header { display: none; }
  /* mirando el RAW no hay nada que ajustar: el panel queda apagado (inert) */
  aside.off { opacity: 0.35; }
  /* las versiones estan a la izquierda y se guardan solo con Save version: sin el menu de versiones de DialKit ni su
     "copiar parametros" (codigo para un programa) */
  aside .dialkit-panel-toolbar { display: none; }
  /* sin el menu, la linea de la primera carpeta quedaba doble con la del titulo: la misma regla que DialKit usa con
     varios paneles */
  aside .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-folder:first-child { border-top: none; margin-top: 0; }
  /* Save version, la ultima accion del panel: la que guarda, un escalon arriba de Reset */
  aside .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-button:last-child {
    color: var(--dial-text-primary); background: var(--dial-surface-hover);
  }
  aside .dialkit-folder-root > .dialkit-folder-content > .dialkit-folder-inner > .dialkit-button:last-child:active { background: var(--dial-surface); }
  /* DialKit pide Geist Mono a Google Fonts; el editor no sale a la red, asi que va la mono del sistema */
  .dialkit-slider-value, .dialkit-slider-input { font-family: "Geist Mono", "SF Mono", ui-monospace, Menlo, monospace; }
  /* los avisos: Sonner, de Emil Kowalski (recipe/vendor/sonner-2.0.8, React adentro, sin red). Todos neutros, sin
     colores por tipo (pedido del fotografo, 2026-10-19). El contenedor es un popover para quedar arriba tambien del panel de export,
     que esta en la capa superior; Sonner pone su lista fija abajo al centro */
  #toasts { inset: auto; width: 0; height: 0; margin: 0; padding: 0; border: 0; background: none; overflow: visible; }
  #toasts [data-sonner-toast] { box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  /* tooltip propio (popover, para quedar arriba tambien del panel de export): entra desde su boton, 125 ms, y se va
     mas rapido; el que sale al instante, en un grupo ya caliente, no anima */
  .tip {
    position: fixed; inset: auto; left: 0; top: 0; margin: 0; max-width: 240px; pointer-events: none;

precision highp float;
precision highp int;
precision highp sampler2D;

vec3 face(vec3 lin, vec2 px, vec4 r, sampler2D A, sampler2D B, sampler2D C, float f, bool fromBase) {

$("knob").addEventListener("keydown", e => {

// --- zoom: el pellizco del trackpad (Chrome lo manda como rueda con ctrl) o ⌘ + rueda, en cualquier parte de la
// ventana: agranda la foto y nunca la pagina. Sobre el escenario va hacia el puntero; en los paneles, hacia el centro.
// La rueda sola mueve la foto, y en los paneles los desplaza como siempre

  const r = frame.getBoundingClientRect(), v = view(), k = v.size / r.width;
  const px = v.cx + (clientX - r.left - r.width / 2) * k, py = v.cy + (clientY - r.top - r.height / 2) * k;
  const s = Math.min(Math.max(size, minSize()), P().w), f = s / v.size;

function anchor(e) {

  else { const v = view(), k = v.size / size.w; setView(clampView({ cx: v.cx + e.deltaX * k, cy: v.cy + e.deltaY * k, size: v.size }, true)); }

const STOPS = [0.5, 1, 2, 4];

function previewZoomKey(key) {

  if (key === "0") { pview = null; return drawPreview(); }
  const zs = [G.fit, ...STOPS.map(s => s * dpr()).filter(z => z > G.fit * 1.001)];
  const next = key === "-" || key === "_" ? zs.findLast(z => z < G.z * 0.99) : zs.find(z => z > G.z * 1.01);

// --- imagenes: las de pantalla de las cuatro fotos se cargan al abrir; la entera, solo la de la foto actual ----
const eyeUrls = p => (p.eyes || []).flatMap(e => ["base", "0", "100", String(EYE_MAX)].map(tag => `editadas/ojeras/${p.key}-${e.face}-${tag}.png?v=${DATA.version}`));
function preload(first) {
  const order = [first, ...PHOTOS.filter(p => p !== first)];
  // las de pantalla primero, con la capa y la luz del fondo, asi cambiar de foto apenas abierto ya tiene que mostrar;
  // despues las ojeras, que al 70 no hacen falta
  const jobs = [...order.flatMap(p => [screenUrl(p, "edit"), screenUrl(p, "raw"), ...bgUrls(p)]), ...order.flatMap(eyeUrls)];
  // de a dos: la primera foto llega antes y la memoria no salta

// archivo se pide una sola vez
const fullPending = new Set();

  const urls = [fullUrl(p, "edit"), fullUrl(p, "raw"), ...(layer && p.top != null ? [layerUrl(p, true)] : [])].filter(u => !renderer.ready(u));
  if (urls.every(u => fullPending.has(u))) return;

    .then(() => { if (P() === p) { draw(); if (panelOpen()) drawPreview(); } }, () => {})
    .finally(() => urls.forEach(u => fullPending.delete(u)));

// la entera de la foto anterior se suelta (son 280 MB en la placa, 420 con la capa); la de esta se pide si se queda un rato

  document.querySelectorAll("#guide button").forEach((b, i) => b.setAttribute("aria-pressed", String(GUIDES[i] === state.guide)));

  const items = [...baseItem(id, { value: "base", name: "Version 1" }), ...store.getPresets(id).map(v => ({ value: v.id, name: v.name }))];
  if (!items.some(v => v.value === state.before[p.key])) state.before[p.key] = null;

// --- el panel: DialKit, uno por foto. Las versiones son los presets de DialKit ------------------
// DialKit guarda en sessionStorage; al abrir, el servidor lo llena con lo de editadas/versiones.json y cada cambio
// vuelve al servidor: localStorage depende del puerto, y el editor abre en el que este libre
// las ojeras, una por cara (pedido del fotografo, 2026-10-19: "que se le puedan modificar las ojeras por cara, en las fotos grupales"):
// un control por persona, de izquierda a derecha. La clave es la persona y no el lugar, asi copiar de un retrato a una
// de grupo cae en la misma cara. Antes era un solo "Intensity" para todas: migrate() lo pasa a cada cara
// el nombre de cada cara en el panel, por su id de recipe/photos.py: { "face-id": "Label" }. Sin entrada, el id
// capitalizado ("persona-1" -> "Persona 1")
const FACE_NAMES = {};

const eyeControls = p => [...(p.eyes ?? [])].sort((a, b) => a.x - b.x).map(e => [faceName(e.face), e.face]);
const CONFIG = {

    Exposure: [0, -2, 2, 0.01], Brightness: [0, -100, 100, 1], Contrast: [0, -100, 100, 1], Highlights: [0, -100, 100, 1],
    Shadows: [0, -100, 100, 1], Whites: [0, -100, 100, 1], Blacks: [0, -100, 100, 1],
  },
  Color: { Temperature: [0, -100, 100, 1], Tint: [0, -100, 100, 1], Vibrance: [0, -100, 100, 1], Saturation: [0, -100, 100, 1] },
  // solo la pared, con la mascara del matting (recipe/backdrop.py)
  Background: {
    Exposure: [0, -2, 2, 0.01], Evenness: [0, 0, 100, 1], Smoothing: [0, 0, 100, 1], Falloff: [0, 0, 100, 1],
    Temperature: [0, -100, 100, 1], Tint: [0, -100, 100, 1], Saturation: [0, -100, 100, 1],
  },
  Reset: { type: "action" },
  "Copy to other photos": { type: "action" },
  "Save version": { type: "action" },
};
const defaultsFor = p => Object.fromEntries(Object.entries(configFor(p)).filter(([, v]) => !v.type).map(([folder, controls]) =>
  [folder, Object.fromEntries(Object.entries(controls).map(([k, c]) => [k, c[0]]))]));
const store = DialKit.DialStore;
const MAX_VERSIONS = 40, MAX_NAME = 40;  // los topes de editor_server.py (MAX_PRESETS, MAX_NAME)
const storeKey = key => `studio-edit:${key}`;
const panelId = key => `edit-${key}`;
DialKit.createDialRoot({ mode: "inline", target: $("controls"), theme: "dark" });
let dial = null;

// el punto de partida del panel de cada foto (recipe/equivalents.py): los ajustes con los que el RAW original queda mas
// cerca de la maestra. La maestra se ve tal cual; Light y Color arrancan en estos valores, y lo que se aplica (shader y
// servidor) es la diferencia con ellos. Las versiones guardan los valores del panel. Sin el dato, 0: el panel de siempre
const STARTS = DATA.starts ?? {};
const startOf = p => Object.fromEntries(KEYS.map(k => [k, STARTS[p.key]?.[k] ?? 0]));
// de los valores del panel a lo que se aplica sobre la maestra: al paso de cada control y dentro del rango de adjust.py
// (un punto de partida recalculado puede dejar una version guardada mas lejos que eso)
const deltaOf = (abs, start) => Object.fromEntries(KEYS.map(k => {
  const limit = k === "exposure" ? 2 : 100, d = abs[k] - start[k], v = k === "exposure" ? Math.round(d * 100) / 100 : Math.round(d);
  return [k, Math.min(limit, Math.max(-limit, v)) || 0];  // || 0: sin -0
}));

// rango de adjust.py, que en 0 no hace nada
const around = (controls, start) => Object.fromEntries(Object.entries(controls).map(([name, [, min, max, step]]) => {
  // redondeado al paso: 0.93 - 2 da -1.0699999999999998, y DialKit saca de ahi cuantos decimales mostrar
  const v = start[name.toLowerCase()], fix = x => +(Math.round(x / step) * step).toFixed(2);

      highlights: at(L.Highlights, "highlights"), shadows: at(L.Shadows, "shadows"), whites: at(L.Whites, "whites"),
      blacks: at(L.Blacks, "blacks"), temperature: at(C.Temperature, "temperature"), tint: at(C.Tint, "tint"),

// una foto importada todavia sin ojeras inventariadas no tiene Under-eyes, y sin pared de estudio no tiene Background
const configFor = p => ({

  ...Object.fromEntries(Object.entries(CONFIG).filter(([k]) => k !== "Background" || p.top != null)

function mountControls(p) {

    onAction: a => { if (a === "Reset") current.setValues(defaultsFor(p)); else if (a === "Save version") saveVersion(); else if (a === COPY) copyToOthers(); },
  });

// ninguna guardada: el usuario la saco de la lista el 2026-10-18, y abrir una foto pone su primera version
const baseItem = (id, item) => (store.getPresets(id).length ? [] : [item]);

function renderVersions() {
  const id = dial.id, active = store.getActivePresetId(id);
  const items = [...baseItem(id, { id: null, name: "Version 1" }), ...store.getPresets(id)];
  const sig = JSON.stringify([id, active, items.map(v => [v.id, v.name])]);

// las versiones son las mismas en todas las fotos (pedido del fotografo, 2026-10-19: "si se elimina de una se elimina de todas"): la

// servidor: se escriben los dos
const COPY = "Copy to other photos";

  for (let lost = 0; ; ) {

    else panPreview(e.deltaX * dpr(), e.deltaY * dpr());
  }, { passive: false });
  let pinch = null;  // Safari: el pellizco llega como gesture*, con la escala desde que empezo
  $("preview").addEventListener("gesturestart", e => { e.preventDefault(); pinch = { z: pvGeom().z, at: toPhoto(e) }; });
  $("preview").addEventListener("gesturechange", e => { e.preventDefault(); if (pinch) zoomPreview(pinch.z * e.scale, ...pinch.at); });
  $("preview").addEventListener("gestureend", e => { e.preventDefault(); pinch = null; });
  // doble clic y el boton: al 100 % (donde se hizo clic) y de vuelta a la foto entera
  const toggle = at => (pview ? ((pview = null), drawPreview()) : zoomPreview(dpr(), ...at));
  pc.addEventListener("dblclick", e => toggle(toPhoto(e)));
  $("pvZoom").addEventListener("click", () => { const G = pvGeom(); toggle([G.cx, G.cy]); });
  pc.addEventListener("keydown", e => {
    const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!step) return;
    e.preventDefault(); e.stopPropagation();
    const d = Math.max(P().w, P().h) * (e.shiftKey ? 0.1 : 0.02);
    setRect(P(), dragRect(box(), {}, step[0] * d, step[1] * d));
    setOpt("crops", opts.crops);
  });
}
buttons($("format"), FORMATS, i => setOpt("format", FORMATS[i].id), (b, f) => { b.textContent = f.label; });
buttons($("size"), SIZES, i => setOpt("size", SIZES[i]), (b, s) => { b.textContent = s === "full" ? "Full" : s; });
buttons($("shape"), SHAPES, i => pickShape(SHAPES[i]), (b, c) => { b.textContent = c === "circle" ? "Circle" : "Square"; });

// Espacio, mantenido, muestra el RAW desde cualquier lado salvo donde se escribe, y solo sobre la version (en el RAW y en
// el antes y despues no hace nada, pedido del fotografo): se toma antes que los controles, asi un boton con foco no se aprieta. Las flechas, sobre un control, son del control
const typing = t => t instanceof Element && !!t.closest("input, textarea, select, [contenteditable], [role=menu]");
document.addEventListener("keydown", e => {
  // ⌘+ ⌘- y ⌘0 agrandan la foto, nunca la pagina (en un teclado en espanol el + es su propia tecla)
  if ((e.metaKey || e.ctrlKey) && !e.altKey && ["=", "+", "-", "_", "0"].includes(e.key)) {
    e.preventDefault();
    if (panelOpen()) return previewZoomKey(e.key);
    if (!zoomable()) return;
    if (e.key === "0") return animateTo(fitView(P()));
    return zoomStep(e.key === "-" || e.key === "_" ? -1 : 1);
  }
  if (panelOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " ") {
    if (typing(e.target)) return;
    e.preventDefault(); e.stopPropagation();
    if (!e.repeat && mode() === "edit") setPeek(true);
    return;
  }
  if (typing(e.target) || e.target instanceof Element && e.target.closest(".dialkit-root, select, .knob")) return;  // la perilla corre la barra
  if (e.key === "f" || e.key === "F") { e.preventDefault(); return toggleFlip(); }
  const m = PHOTOS.length;
  if (e.key === "ArrowRight") { e.preventDefault(); return pickPhoto((state.photo + 1) % m); }
  if (e.key === "ArrowLeft") { e.preventDefault(); return pickPhoto((state.photo + m - 1) % m); }
  // ↓ ↑ recorren la lista de versiones, para pasar de una a otra y ver la diferencia
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const ids = [...baseItem(dial.id, null), ...store.getPresets(dial.id).map(v => v.id)], at = ids.indexOf(store.getActivePresetId(dial.id));
    return pickVersion(ids[Math.min(Math.max(at + (e.key === "ArrowDown" ? 1 : -1), 0), ids.length - 1)]);
  }
}, true);
document.addEventListener("keyup", e => {
  if (e.key !== " " || !state.peek) return;
  e.preventDefault(); e.stopPropagation();
  setPeek(false);
}, true);
addEventListener("blur", () => setPeek(false));
addEventListener("resize", () => fit());
// cambiar de pantalla cambia la densidad: el lienzo se rehace a la nueva
(function watchDpr() {
  matchMedia(`(resolution: ${dpr()}dppx)`).addEventListener("change", () => { fit(); watchDpr(); }, { once: true });
})();
canvas.addEventListener("webglcontextlost", e => e.preventDefault());
canvas.addEventListener("webglcontextrestored", () => location.reload());

// --- arranque: las versiones guardadas primero (sin ellas DialKit arrancaria de cero), y la foto 1 -------
async function boot() {
  if (!renderer) { toast("This browser can't draw the editor (WebGL2)"); return; }
  for (const p of PHOTOS) state.views[p.key] = fitView(p);
  preload(PHOTOS[0]);
  try {
    const r = await fetch("api/versions", { cache: "no-store" });
    if (r.ok) for (const [key, s] of Object.entries((await r.json()).photos ?? {})) {
      const body = JSON.stringify(s);
      sessionStorage.setItem(storeKey(key), body);
      sent[key] = body;
    }
  } catch {}
  migrate();
  fillEmptyVersions();
  const pick = sessionStorage.getItem("studio-pick");
  sessionStorage.removeItem("studio-pick");
  pickPhoto(Math.max(0, PHOTOS.findIndex(p => p.key === pick)));
  pollImports();
}
boot();
</script>
</body>
</html>
